name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install .
          pip install ".[dev]"

      # ---------------- DEBUG STEP 1 ----------------
      - name: Show Python package versions
        run: |
          python --version
          pip --version
          pip freeze | grep fastapi || true
          pip freeze | grep starlette || true
          pip freeze | grep pydantic || true

      # ---------------- DEBUG STEP 2 ----------------
      - name: Show registered routes
        run: |
          python -c "from app.main import app; print('FASTAPI ROUTES'); [print(type(r).__name__, getattr(r,'path',None)) for r in app.routes]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest